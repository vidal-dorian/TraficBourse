# Production stack on the Pi (see DEPLOY.md). Variables come from the shell or from `.env`
# next to this file; defaults suit the Pi.
#
# Three services, one image:
# - migrate: one-shot, applies the Drizzle migrations, then seeds the concepts, then exits. web and jobs only start
#   once it succeeded, so the schema is always up to date before anything uses it, and the
#   two long-running processes never race to migrate the same file.
# - web: Next.js server (pages, API), port 3000 on 127.0.0.1, reverse-proxied by Caddy.
# - jobs: node-cron scheduler (prices, missing-brief check, backup from phase 2).
name: traficbourse

x-logging: &logging
  # Rotated logs: at most 3 files of 10 MB per container.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ghcr.io/vidal-dorian/traficbourse:${IMAGE_TAG:-latest}
  platform: ${PLATFORM:-linux/arm64}
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_PATH: /data/bourse.db
  volumes:
    # SQLite file on the data disk (never on the system USB key).
    - type: bind
      source: ${BOURSE_DATA_DIR:-/mnt/data/bourse}
      target: /data
      bind:
        create_host_path: false
  logging: *logging

services:
  migrate:
    <<: *app
    command: ["sh", "-c", "node dist/lib/db/migrate.js && node dist/lib/db/seed-concepts.js"]
    restart: "no"

  web:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "server.js"]
    ports:
      # Loopback only: the sole way in is Cloudflare Tunnel -> Caddy on the host. Docker's own
      # iptables rules bypass ufw, so publishing on 0.0.0.0 would let anyone on the LAN (or
      # through a port-forward / routable IPv6) skip Cloudflare Access and rate limiting.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  jobs:
    <<: *app
    command: ["node", "dist/jobs/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
